name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The minimum version the package declares. Pick a tag that exists as a
  # game-ci editor image: https://game.ci/docs/docker/versions
  UNITY_VERSION: 6000.0.58f2
  PACKAGE_NAME: com.alpershin.simpleuiscreenssystem
  # The host project stays next to the checkout, never on top of it: the
  # game-ci CLI runs git commands in the workspace root.
  PROJECT_PATH: host

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: EditMode and PlayMode
    runs-on: ubuntu-latest
    steps:
      - name: Check out the package
        uses: actions/checkout@v4

      - name: Check that a Unity licence is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_EMAIL" ]; then
            echo "::error::No Unity licence is configured. Add the UNITY_LICENSE secret (or UNITY_EMAIL and UNITY_PASSWORD); see .github/workflows/README.md."
            exit 1
          fi

      - name: Create the host project
        run: |
          set -eux
          mkdir -p "${PROJECT_PATH}/Assets" "${PROJECT_PATH}/ProjectSettings" \
                   "${PROJECT_PATH}/Packages/${PACKAGE_NAME}"
          git archive HEAD | tar -x -C "${PROJECT_PATH}/Packages/${PACKAGE_NAME}"
          echo "m_EditorVersion: ${UNITY_VERSION}" > "${PROJECT_PATH}/ProjectSettings/ProjectVersion.txt"
          cat > "${PROJECT_PATH}/Packages/manifest.json" <<JSON
          {
            "dependencies": {
              "com.unity.addressables": "2.7.6",
              "com.unity.ugui": "2.0.0",
              "com.unity.test-framework": "1.4.5"
            },
            "testables": ["${PACKAGE_NAME}"]
          }
          JSON

      - name: Cache the Library folder
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('package.json') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-

      - name: Run the tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Test results

      - name: Upload the results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
